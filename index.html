<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國中音樂教室座位編排系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler for Browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 原生 SVG 圖示組件（零外部依賴）
    const IconUsers = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>;
    const IconUpload = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
    const IconShuffle = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h2m8 0h2a2 2 0 012 2v8a2 2 0 01-2 2h-2m-8 0l-4-4m0 0l4-4m0 4h12" /></svg>;
    const IconDownload = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>;
    const IconCopy = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>;
    const IconSettings = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>;
    const IconRefresh = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
    const IconPrinter = () => <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>;
    const IconAlert = () => <svg className="w-6 h-6 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
    const IconPlus = () => <svg className="w-3.5 h-3.5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>;
    const IconTrash = () => <svg className="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;

    // 精確比對圖片 (919 班座位表) 之男女棋盤交錯 6x6 佈局:
    const defaultLayout = [
      ['none', 'male', 'female', 'male', 'female', 'male'],
      ['male', 'female', 'male', 'female', 'male', 'female'],
      ['female', 'male', 'female', 'male', 'female', 'male'],
      ['male', 'female', 'male', 'female', 'male', 'female'],
      ['female', 'male', 'female', 'male', 'female', 'male'],
      ['male', 'female', 'male', 'female', 'none', 'none']
    ];

    function App() {
      // 預設 20 個班級: 901 ~ 920
      const [classes, setClasses] = useState(() => {
        const saved = localStorage.getItem('music_room_classes_v3');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return Array.from({ length: 20 }, (_, i) => ({
          id: `class-${i + 1}`,
          name: `9${(i + 1).toString().padStart(2, '0')}`,
          students: [
            { seatNo: 1, name: '吳永睿', gender: '男' },
            { seatNo: 2, name: '李書承', gender: '男' },
            { seatNo: 3, name: '周維凱', gender: '男' },
            { seatNo: 4, name: '林丞愷', gender: '男' },
            { seatNo: 5, name: '洪承暘', gender: '男' },
            { seatNo: 6, name: '胡力翔', gender: '男' },
            { seatNo: 7, name: '徐宏碩', gender: '男' },
            { seatNo: 8, name: '徐秉彤', gender: '男' },
            { seatNo: 9, name: '張柏晟', gender: '男' },
            { seatNo: 10, name: '郭奕辰', gender: '男' },
            { seatNo: 11, name: '陳廷維', gender: '男' },
            { seatNo: 12, name: '陳品豪', gender: '男' },
            { seatNo: 13, name: '陳彥希', gender: '男' },
            { seatNo: 14, name: '劉浩辰', gender: '男' },
            { seatNo: 15, name: '鄭喬駿', gender: '男' },
            { seatNo: 16, name: '蕭玎錐', gender: '男' },
            { seatNo: 17, name: '謝永承', gender: '男' },
            { seatNo: 18, name: '王唯恩', gender: '女' },
            { seatNo: 19, name: '李昀珊', gender: '女' },
            { seatNo: 20, name: '侯詩紜', gender: '女' },
            { seatNo: 21, name: '姜涵勻', gender: '女' },
            { seatNo: 22, name: '張卉岑', gender: '女' },
            { seatNo: 23, name: '莊若雲', gender: '女' },
            { seatNo: 24, name: '莊婕瑜', gender: '女' },
            { seatNo: 25, name: '莊瑀芝', gender: '女' },
            { seatNo: 26, name: '彭子軒', gender: '女' },
            { seatNo: 27, name: '彭穎暄', gender: '女' },
            { seatNo: 28, name: '湯育慈', gender: '女' },
            { seatNo: 29, name: '馮乙琳', gender: '女' },
            { seatNo: 30, name: '黃品童', gender: '女' },
            { seatNo: 31, name: '詹雨玹', gender: '女' },
            { seatNo: 32, name: '戴瑀岑', gender: '女' },
            { seatNo: 33, name: '闕潔怡', gender: '女' }
          ]
        }));
      });

      const [currentClassId, setCurrentClassId] = useState(() => classes[0]?.id || 'class-1');
      
      // 各班獨立的座位佈局 (Map: classId -> gridLayout)
      const [classGrids, setClassGrids] = useState(() => {
        const saved = localStorage.getItem('music_room_class_grids_v1');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {};
      });

      // 取得目前選取班級的 grid (若該班尚未設定，則預設使用 defaultLayout)
      const grid = classGrids[currentClassId] || defaultLayout.map(row => 
        row.map(type => ({ type, student: null }))
      );

      const [mode, setMode] = useState('view');
      const [assignments, setAssignments] = useState(() => {
        const saved = localStorage.getItem(`music_room_assign_${currentClassId}`);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {};
      });

      const [validationModal, setValidationModal] = useState({
        isOpen: false,
        title: '',
        message: '',
        details: null,
        onConfirm: null
      });

      const [importModalOpen, setImportModalOpen] = useState(false);
      const [rawTextImport, setRawTextImport] = useState('');
      const [toastMessage, setToastMessage] = useState('');

      const seatingAreaRef = useRef(null);
      const currentClass = classes.find(c => c.id === currentClassId) || classes[0] || { id: '', name: '', students: [] };

      useEffect(() => {
        localStorage.setItem('music_room_classes_v3', JSON.stringify(classes));
      }, [classes]);

      useEffect(() => {
        localStorage.setItem('music_room_class_grids_v1', JSON.stringify(classGrids));
      }, [classGrids]);

      useEffect(() => {
        const saved = localStorage.getItem(`music_room_assign_${currentClassId}`);
        if (saved) {
          try { setAssignments(JSON.parse(saved)); } catch (e) { setAssignments({}); }
        } else {
          setAssignments({});
        }
      }, [currentClassId]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const getSeatStats = () => {
        let maleSeats = 0, femaleSeats = 0, emptySeats = 0, totalChairs = 0;
        grid.forEach(row => {
          row.forEach(cell => {
            if (cell.type === 'male') maleSeats++;
            if (cell.type === 'female') femaleSeats++;
            if (cell.type === 'empty') emptySeats++;
            if (cell.type !== 'none') totalChairs++;
          });
        });
        return { maleSeats, femaleSeats, emptySeats, totalChairs };
      };

      const getStudentStats = () => {
        if (!currentClass || !currentClass.students) return { males: 0, females: 0, total: 0 };
        const males = currentClass.students.filter(s => s.gender === '男' || s.gender === 'M').length;
        const females = currentClass.students.filter(s => s.gender === '女' || s.gender === 'F').length;
        return { males, females, total: currentClass.students.length };
      };

      const handleAddClass = () => {
        const newNum = classes.length + 1;
        const newClassObj = {
          id: `class-${Date.now()}`,
          name: `9${newNum.toString().padStart(2, '0')}`,
          students: []
        };
        setClasses([...classes, newClassObj]);
        setCurrentClassId(newClassObj.id);
        showToast(`已新增班級【${newClassObj.name}】`);
      };

      const handleDeleteClass = (e, targetId) => {
        e.stopPropagation();
        if (classes.length <= 1) {
          alert('至少需要保留一個班級！');
          return;
        }
        const targetClass = classes.find(c => c.id === targetId);
        if (window.confirm(`確定要刪除【${targetClass?.name || '此班級'}】嗎？刪除後名單無法復原。`)) {
          const nextClasses = classes.filter(c => c.id !== targetId);
          setClasses(nextClasses);
          if (currentClassId === targetId) {
            setCurrentClassId(nextClasses[0].id);
          }
          localStorage.removeItem(`music_room_assign_${targetId}`);
          
          // 同步清理班級佈局設定
          const nextGrids = { ...classGrids };
          delete nextGrids[targetId];
          setClassGrids(nextGrids);

          showToast('已成功刪除班級');
        }
      };

      // 獨立切換當前班級的座位屬性
      const handleCellClickInEdit = (r, c) => {
        const types = ['male', 'female', 'empty', 'none'];
        const currentType = grid[r][c].type;
        const nextType = types[(types.indexOf(currentType) + 1) % types.length];

        const newGrid = grid.map((row, ri) => 
          row.map((cell, ci) => (ri === r && ci === c) ? { ...cell, type: nextType } : cell)
        );
        
        setClassGrids(prev => ({
          ...prev,
          [currentClassId]: newGrid
        }));
      };

      const handleRandomAssign = (force = false) => {
        const seatStats = getSeatStats();
        const studentStats = getStudentStats();

        const maleStudents = currentClass.students.filter(s => s.gender === '男' || s.gender === 'M');
        const femaleStudents = currentClass.students.filter(s => s.gender === '女' || s.gender === 'F');

        const maleMismatch = maleStudents.length !== seatStats.maleSeats;
        const femaleMismatch = femaleStudents.length !== seatStats.femaleSeats;

        if ((maleMismatch || femaleMismatch) && !force) {
          setValidationModal({
            isOpen: true,
            title: '⚠️ 學生人數與座位數量不符',
            message: `當前班級【${currentClass.name}】名單人數與座位顏色屬性設定不一致：`,
            details: {
              maleSeats: seatStats.maleSeats,
              maleStudents: maleStudents.length,
              femaleSeats: seatStats.femaleSeats,
              femaleStudents: femaleStudents.length,
            },
            onConfirm: () => handleRandomAssign(true)
          });
          return;
        }

        const prevPosMap = {};
        Object.entries(assignments).forEach(([key, st]) => {
          if (st && st.seatNo !== undefined) {
            const [r, c] = key.split('-').map(Number);
            prevPosMap[st.seatNo] = { r, c };
          }
        });

        const assignGenderGroup = (studentsGroup, targetType) => {
          const availableCells = [];
          grid.forEach((row, r) => {
            row.forEach((cell, c) => {
              if (cell.type === targetType) availableCells.push({ r, c });
            });
          });

          const students = [...studentsGroup].sort(() => Math.random() - 0.5);

          for (let attempt = 0; attempt < 200; attempt++) {
            const shuffledCells = [...availableCells].sort(() => Math.random() - 0.5);
            let isValid = true;
            const tempAssign = [];

            for (let i = 0; i < students.length; i++) {
              if (i >= shuffledCells.length) break;
              const st = students[i];
              const cell = shuffledCells[i];
              const prev = prevPosMap[st.seatNo];

              if (prev && (prev.r === cell.r || prev.c === cell.c)) {
                isValid = false;
                break;
              }
              tempAssign.push({ cell, student: st });
            }

            if (isValid || attempt === 199) return tempAssign;
          }
          return [];
        };

        const maleResults = assignGenderGroup(maleStudents, 'male');
        const femaleResults = assignGenderGroup(femaleStudents, 'female');

        const newAssignments = {};
        maleResults.forEach(({ cell, student }) => { newAssignments[`${cell.r}-${cell.c}`] = student; });
        femaleResults.forEach(({ cell, student }) => { newAssignments[`${cell.r}-${cell.c}`] = student; });

        setAssignments(newAssignments);
        localStorage.setItem(`music_room_assign_${currentClassId}`, JSON.stringify(newAssignments));
        showToast(`已完成座位分配！(已套用防跨相同行列規則)`);
      };

      const handleClearAssignments = () => {
        setAssignments({});
        localStorage.removeItem(`music_room_assign_${currentClassId}`);
        showToast('已清空當前座位表內容');
      };

      const parseAndImportStudents = (lines) => {
        const parsedStudents = [];
        lines.forEach((line, idx) => {
          const cleanLine = line.trim();
          if (!cleanLine) return;

          const parts = cleanLine.split(/[\t,; ]+/).filter(Boolean);
          if (parts.length === 0) return;

          const firstPart = parts[0];
          if (firstPart.includes('座號') || firstPart.includes('姓名')) return;

          let seatNo = parseInt(parts[0], 10);
          let name = '';
          let rawGender = '';

          if (!isNaN(seatNo)) {
            name = parts[1] || '';
            rawGender = parts[2] || '';
          } else {
            seatNo = idx + 1;
            name = parts[0] || '';
            rawGender = parts[1] || '';
          }

          let gender = (rawGender.includes('女') || rawGender.toUpperCase() === 'F') ? '女' : '男';
          if (name) parsedStudents.push({ seatNo, name, gender });
        });

        if (parsedStudents.length > 0) {
          updateCurrentClassStudents(parsedStudents);
          setImportModalOpen(false);
          setRawTextImport('');
          showToast(`成功匯入 ${parsedStudents.length} 位學生！`);
        } else {
          alert('未讀取到有效的學生資料，請確認格式（座號 姓名 性別）');
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const lines = evt.target.result.split(/\r\n|\n/);
            parseAndImportStudents(lines);
          } catch (err) {
            alert('檔案讀取失敗，請上傳 CSV 或 TXT 文字檔。');
          }
        };
        reader.readAsText(file, 'UTF-8');
      };

      const handleTextImport = () => {
        parseAndImportStudents(rawTextImport.split('\n'));
      };

      const updateCurrentClassStudents = (newStudents) => {
        setClasses(prev => prev.map(c => c.id === currentClassId ? { ...c, students: newStudents } : c));
      };

      const handleClassNameChange = (newName) => {
        setClasses(prev => prev.map(c => c.id === currentClassId ? { ...c, name: newName } : c));
      };

      const handleExportPNG = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const width = 1200, height = 800;
        canvas.width = width;
        canvas.height = height;

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, width, height);

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`${currentClass.name}`, width / 2, 50);

        ctx.fillStyle = '#ea580c';
        ctx.fillRect(width / 2 - 220, 70, 440, 40);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px sans-serif';
        ctx.fillText('講 台', width / 2, 98);

        ctx.fillStyle = '#2563eb';
        ctx.fillRect(90, 40, 50, 70);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('鋼', 115, 68);
        ctx.fillText('琴', 115, 93);

        ctx.fillStyle = '#65a30d';
        ctx.fillRect(width - 90, 40, 60, 40);
        ctx.fillText('前門', width - 60, 67);

        ctx.fillRect(width - 90, 710, 60, 40);
        ctx.fillText('後門', width - 60, 737);

        const startX = 140, startY = 130, cellW = 154, cellH = 90, gap = 8;
        grid.forEach((row, r) => {
          row.forEach((cell, c) => {
            const x = startX + c * (cellW + gap);
            const y = startY + r * (cellH + gap);
            const student = assignments[`${r}-${c}`];

            if (cell.type === 'none') return;

            ctx.fillStyle = cell.type === 'male' ? '#e0f2fe' : cell.type === 'female' ? '#ffe6d5' : '#e2e8f0';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.fillRect(x, y, cellW, cellH);
            ctx.strokeRect(x, y, cellW, cellH);

            const dividerX = x + 42;
            ctx.beginPath();
            ctx.moveTo(dividerX, y);
            ctx.lineTo(dividerX, y + cellH);
            ctx.stroke();

            if (student) {
              ctx.fillStyle = '#000000';
              ctx.font = 'bold 22px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText(`${student.seatNo}`, x + 21, y + cellH / 2 + 8);

              ctx.font = 'bold 24px sans-serif';
              ctx.fillText(student.name, dividerX + 56, y + cellH / 2 + 8);
            } else if (cell.type === 'empty') {
              ctx.fillStyle = '#64748b';
              ctx.font = '16px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('灰', x + 21, y + cellH / 2 + 6);
              ctx.fillText('不坐人', dividerX + 56, y + cellH / 2 + 6);
            }
          });
        });

        const link = document.createElement('a');
        link.download = `${currentClass.name}_音樂教室座位表.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('已成功下載圖片！');
      };

      const handleCopyForPPT = () => {
        let htmlStr = `<table border="1" style="border-collapse: collapse; text-align: center; font-family: Microsoft JhengHei, sans-serif; width: 100%; border: 2px solid #000;">`;
        grid.forEach((row, r) => {
          htmlStr += `<tr style="height: 50px;">`;
          row.forEach((cell, c) => {
            const student = assignments[`${r}-${c}`];
            let bgColor = cell.type === 'male' ? '#E0F2FE' : cell.type === 'female' ? '#FFE6D5' : cell.type === 'empty' ? '#E2E8F0' : '#FFFFFF';

            if (cell.type === 'none') {
              htmlStr += `<td style="background-color: #ffffff; border: none; width: 3%;"></td>`;
              htmlStr += `<td style="background-color: #ffffff; border: none; width: 13.6%;"></td>`;
            } else {
              htmlStr += `<td style="background-color: ${bgColor}; color: #000; border: 1px solid #000; width: 3.5%; font-size: 16px; font-weight: bold; vertical-align: middle;">${student ? student.seatNo : ''}</td>`;
              htmlStr += `<td style="background-color: ${bgColor}; color: #000; border: 1px solid #000; width: 13.1%; font-size: 18px; font-weight: bold; vertical-align: middle;">${student ? student.name : cell.type === 'empty' ? '<span style="font-size:13px;color:#666;">不坐人</span>' : ''}</td>`;
            }
          });
          htmlStr += `</tr>`;
        });
        htmlStr += `</table>`;

        try {
          const listener = (e) => {
            e.clipboardData.setData('text/html', htmlStr);
            e.clipboardData.setData('text/plain', '座位表已複製');
            e.preventDefault();
          };
          document.addEventListener('copy', listener);
          document.execCommand('copy');
          document.removeEventListener('copy', listener);
          showToast('已複製左右分格表格！可在 PowerPoint 中按 Ctrl+V 貼上');
        } catch (err) { alert('複製失敗，請重試'); }
      };

      const seatStats = getSeatStats();
      const studentStats = getStudentStats();

      return (
        <div className="min-h-screen bg-slate-100 font-sans text-slate-800 pb-12 print:bg-white print:pb-0">
          <header className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md sticky top-0 z-30 print:hidden">
            <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-white/10 rounded-lg">
                  <span className="text-xl">🎼</span>
                </div>
                <div>
                  <h1 className="text-xl font-bold leading-tight">國中音樂教室座位編排系統</h1>
                  <p className="text-xs text-blue-200">專為音樂教師設計．支援 PPT 左右分格複製與隨機抽籤</p>
                </div>
              </div>

              <div className="flex items-center space-x-2 bg-blue-900/40 p-1 rounded-xl border border-white/10">
                <button onClick={() => setMode('view')} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all ${mode === 'view' ? 'bg-white text-blue-900 shadow-sm' : 'text-blue-100 hover:bg-white/10'}`}>
                  座位編排與抽籤
                </button>
                <button onClick={() => setMode('layout')} className={`px-4 py-1.5 rounded-lg text-sm font-medium transition-all flex items-center gap-1.5 ${mode === 'layout' ? 'bg-amber-400 text-slate-900 font-bold' : 'text-blue-100 hover:bg-white/10'}`}>
                  <IconSettings /> 編輯教室佈局
                </button>
              </div>
            </div>
          </header>

          {toastMessage && (
            <div className="fixed top-16 right-4 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-xl flex items-center space-x-2 border border-slate-700 animate-bounce print:hidden">
              <span className="text-green-400 font-bold">✓</span>
              <span className="text-sm font-medium">{toastMessage}</span>
            </div>
          )}

          <main className="max-w-7xl mx-auto px-4 mt-6 print:m-0 print:p-0 print:max-w-none">
            <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 print:block">
              <div className="lg:col-span-1 space-y-5 print:hidden">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
                  <div className="flex items-center justify-between mb-3">
                    <h2 className="text-sm font-bold text-slate-500 uppercase tracking-wider">班級選擇 ({classes.length}個班)</h2>
                    <button onClick={handleAddClass} className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-2 py-1 rounded-lg flex items-center gap-1">
                      <IconPlus /> 新增班級
                    </button>
                  </div>
                  <div className="grid grid-cols-3 gap-2 max-h-56 overflow-y-auto pr-1 mb-4">
                    {classes.map((cls) => (
                      <div key={cls.id} onClick={() => setCurrentClassId(cls.id)} className={`group relative py-2 px-1 rounded-xl text-xs font-bold transition-all text-center cursor-pointer border flex items-center justify-center ${currentClassId === cls.id ? 'bg-blue-600 text-white border-blue-600 shadow-sm scale-105 z-10' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}>
                        <span>{cls.name}</span>
                        {classes.length > 1 && (
                          <button onClick={(e) => handleDeleteClass(e, cls.id)} className="absolute -top-1 -right-1 p-0.5 rounded-full bg-red-500 text-white opacity-0 group-hover:opacity-100 hover:bg-red-600">
                            <IconTrash />
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center space-x-2 pt-2 border-t border-slate-100">
                    <span className="text-xs text-slate-500 whitespace-nowrap">班級名稱:</span>
                    <input type="text" value={currentClass?.name || ''} onChange={(e) => handleClassNameChange(e.target.value)} className="w-full text-sm font-bold px-2.5 py-1.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
                  <div className="flex items-center justify-between mb-3">
                    <h3 className="font-bold text-slate-800 flex items-center gap-1.5"><IconUsers /> 學生名單 ({studentStats.total}人)</h3>
                    <button onClick={() => setImportModalOpen(true)} className="text-xs text-blue-600 hover:text-blue-800 font-semibold flex items-center gap-1 bg-blue-50 px-2 py-1 rounded-lg border border-blue-200">
                      <IconUpload /> 匯入名單
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mb-4">
                    <div className="bg-sky-50 border border-sky-100 rounded-xl p-2.5 text-center">
                      <span className="text-xs text-sky-700 font-medium block">男生名單</span>
                      <span className="text-lg font-extrabold text-sky-900">{studentStats.males} 人</span>
                    </div>
                    <div className="bg-orange-50 border border-orange-100 rounded-xl p-2.5 text-center">
                      <span className="text-xs text-orange-700 font-medium block">女生名單</span>
                      <span className="text-lg font-extrabold text-orange-900">{studentStats.females} 人</span>
                    </div>
                  </div>
                  <div className="max-h-60 overflow-y-auto border border-slate-200 rounded-xl divide-y divide-slate-100 text-sm">
                    {(!currentClass || !currentClass.students || currentClass.students.length === 0) ? (
                      <div className="py-8 text-center text-slate-400 text-xs">尚未匯入學生名單<br/>點擊「匯入名單」可從 Excel 貼上</div>
                    ) : (
                      currentClass.students.map((st, i) => (
                        <div key={i} className="px-3 py-1.5 flex items-center justify-between hover:bg-slate-50">
                          <div className="flex items-center space-x-2">
                            <span className="w-5 text-xs text-slate-400 text-right font-mono">{st.seatNo}.</span>
                            <span className="font-medium text-slate-700">{st.name}</span>
                          </div>
                          <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${st.gender === '男' ? 'bg-sky-100 text-sky-800' : 'bg-orange-100 text-orange-800'}`}>{st.gender}</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </div>

              <div className="lg:col-span-3 space-y-4 print:w-full">
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 flex flex-wrap items-center justify-between gap-3 print:hidden">
                  <div className="flex items-center space-x-4 text-xs font-medium">
                    <span className="text-slate-500">座位容量:</span>
                    <span className="flex items-center gap-1 text-sky-700 bg-sky-50 px-2.5 py-1 rounded-md border border-sky-200"><span className="w-2 h-2 rounded-full bg-sky-400 inline-block"></span>男: {seatStats.maleSeats}</span>
                    <span className="flex items-center gap-1 text-orange-700 bg-orange-50 px-2.5 py-1 rounded-md border border-orange-200"><span className="w-2 h-2 rounded-full bg-orange-400 inline-block"></span>女: {seatStats.femaleSeats}</span>
                    <span className="flex items-center gap-1 text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">不坐人: {seatStats.emptySeats}</span>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    {mode === 'view' ? (
                      <>
                        <button onClick={() => handleRandomAssign(false)} className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-sm flex items-center gap-1.5">
                          <IconShuffle /> 隨機分配座位
                        </button>
                        <button onClick={handleClearAssignments} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold px-3 py-2 rounded-xl">
                          <IconRefresh />
                        </button>
                        <div className="h-5 w-px bg-slate-200 mx-1"></div>
                        <button onClick={handleCopyForPPT} className="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5">
                          <IconCopy /> 複製貼回 PPT
                        </button>
                        <button onClick={handleExportPNG} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5">
                          <IconDownload /> 匯出圖檔
                        </button>
                        <button onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5">
                          <IconPrinter /> 列印 / PDF
                        </button>
                      </>
                    ) : (
                      <div className="flex items-center space-x-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-lg">
                        <span>💡 點擊格子切換：<b>男位 (藍)</b> ➔ <b>女位 (粉橘)</b> ➔ <b>不坐人 (灰)</b> ➔ <b>無桌椅</b></span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 relative overflow-hidden print:shadow-none print:border-none print:p-0" ref={seatingAreaRef}>
                  <div className="relative mb-6">
                    <div className="absolute left-2 top-0 w-12 h-16 bg-blue-600 text-white font-bold rounded-lg flex flex-col items-center justify-center text-sm shadow-md border border-blue-700 select-none">
                      <span>鋼</span><span>琴</span>
                    </div>
                    <div className="absolute right-2 top-0 bg-lime-700 text-white text-xs font-bold px-3 py-2 rounded-lg border border-lime-800">前門</div>
                    <div className="text-center pt-1">
                      <div className="flex justify-center items-baseline mb-2">
                        <h2 className="text-3xl font-black text-slate-800 tracking-tight">{currentClass?.name || '---'}</h2>
                      </div>
                      <div className="mx-auto w-3/5 bg-orange-500 text-white font-bold text-center py-2.5 rounded-xl shadow-sm border border-orange-600 tracking-widest text-lg">講 台</div>
                    </div>
                  </div>

                  <div className="relative">
                    <div className="grid grid-cols-6 gap-2 py-1">
                      {grid.map((row, r) =>
                        row.map((cell, c) => {
                          const student = assignments[`${r}-${c}`];
                          if (cell.type === 'none') {
                            return mode === 'layout' ? (
                              <div
                                key={`${r}-${c}`}
                                onClick={() => handleCellClickInEdit(r, c)}
                                className="h-16 rounded-md border-2 border-dashed border-slate-300 bg-slate-50/50 hover:bg-blue-50/80 hover:border-blue-400 flex items-center justify-center cursor-pointer transition-all"
                              >
                                <span className="text-xs text-slate-400 font-medium">+ 無座位</span>
                              </div>
                            ) : (
                              <div key={`${r}-${c}`} className="h-16 opacity-0 pointer-events-none" />
                            );
                          }

                          let containerBg = cell.type === 'male' ? "bg-[#e0f2fe] border-slate-800 text-slate-900" :
                                            cell.type === 'female' ? "bg-[#ffe6d5] border-slate-800 text-slate-900" :
                                            "bg-slate-200 border-slate-800 text-slate-600";

                          return (
                            <div key={`${r}-${c}`} onClick={() => mode === 'layout' && handleCellClickInEdit(r, c)} className={`h-16 rounded-md border border-slate-800 flex items-stretch overflow-hidden ${containerBg} ${mode === 'layout' ? 'cursor-pointer hover:ring-2 hover:ring-blue-500' : ''}`}>
                              <div className="w-1/3 border-r border-slate-800 flex items-center justify-center font-bold text-base bg-black/5">
                                {student ? student.seatNo : cell.type === 'empty' ? <span className="text-xs text-slate-400">-</span> : null}
                              </div>
                              <div className="w-2/3 flex items-center justify-center font-bold text-base tracking-wide px-1">
                                {student ? <span className="truncate">{student.name}</span> : cell.type === 'empty' ? <span className="text-xs text-slate-500 font-normal">不坐人</span> : <span className="text-xs opacity-30">{cell.type === 'male' ? '男' : '女'}</span>}
                              </div>
                            </div>
                          );
                        })
                      )}
                    </div>
                    <div className="absolute right-[-54px] bottom-1 bg-lime-700 text-white text-xs font-bold px-3 py-2 rounded-lg border border-lime-800">後門</div>
                  </div>

                  <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-center gap-6 text-xs font-medium text-slate-600">
                    <div className="flex items-center gap-1.5"><span className="w-4 h-4 rounded border border-slate-800 bg-[#e0f2fe]"></span>男生座位 (藍)</div>
                    <div className="flex items-center gap-1.5"><span className="w-4 h-4 rounded border border-slate-800 bg-[#ffe6d5]"></span>女生座位 (粉橘)</div>
                    <div className="flex items-center gap-1.5"><span className="w-4 h-4 rounded border border-slate-800 bg-slate-200"></span>固定不坐人 (灰)</div>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {validationModal.isOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-100">
                <div className="bg-amber-500 text-white p-4 flex items-center space-x-2">
                  <IconAlert />
                  <h3 className="font-bold text-lg">{validationModal.title}</h3>
                </div>
                <div className="p-5 space-y-4 text-slate-700 text-sm">
                  <p>{validationModal.message}</p>
                  {validationModal.details && (
                    <div className="bg-slate-50 rounded-xl p-3 space-y-2 border border-slate-200 font-medium">
                      <div className="flex justify-between items-center text-blue-900"><span>男生名單 / 藍色座位：</span><span className="font-bold">{validationModal.details.maleStudents} 人 / {validationModal.details.maleSeats} 格</span></div>
                      <div className="flex justify-between items-center text-amber-900"><span>女生名單 / 橘色座位：</span><span className="font-bold">{validationModal.details.femaleStudents} 人 / {validationModal.details.femaleSeats} 格</span></div>
                    </div>
                  )}
                </div>
                <div className="bg-slate-50 px-5 py-3.5 flex justify-end space-x-2">
                  <button onClick={() => setValidationModal({ ...validationModal, isOpen: false })} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200">取消</button>
                  <button onClick={() => { setValidationModal({ ...validationModal, isOpen: false }); if (validationModal.onConfirm) validationModal.onConfirm(); }} className="px-4 py-2 rounded-xl text-xs font-bold bg-amber-600 hover:bg-amber-700 text-white">仍要抽籤</button>
                </div>
              </div>
            </div>
          )}

          {importModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden">
                <div className="bg-blue-600 text-white p-4 flex items-center justify-between">
                  <div className="flex items-center space-x-2"><h3 className="font-bold text-lg">匯入【{currentClass?.name}】學生名單</h3></div>
                  <button onClick={() => setImportModalOpen(false)} className="text-blue-100 font-bold">✕</button>
                </div>
                <div className="p-6 space-y-6">
                  <div>
                    <label className="block font-bold text-slate-800 text-sm mb-1">方法一：上傳 CSV / TXT 檔案</label>
                    <input type="file" accept=".csv, .txt" onChange={handleFileUpload} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-800 text-sm mb-1">方法二：從 Excel 複製貼上文字</label>
                    <textarea rows={6} value={rawTextImport} onChange={(e) => setRawTextImport(e.target.value)} placeholder={`格式範例：\n1\t吳永睿\t男\n2\t李書承\t男\n3\t王唯恩\t女`} className="w-full text-xs font-mono p-3 border border-slate-300 rounded-xl focus:outline-none" />
                  </div>
                </div>
                <div className="bg-slate-50 px-6 py-4 flex justify-end space-x-2">
                  <button onClick={() => setImportModalOpen(false)} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200">取消</button>
                  <button onClick={handleTextImport} className="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white">確認匯入</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
